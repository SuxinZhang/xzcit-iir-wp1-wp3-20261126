name: XZCIT-IIR CI

# Six mandatory jobs from WP_INTEGRATION_FIX FIX-06.
# WP_INTEGRATION_FIX FIX-06 规定的六个强制 Job。
on:
  push:
    branches: ['dev/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) UTF-8 / LF / Python syntax gate.
  # 1）UTF-8 / LF / Python 语法门禁。
  encoding-check:
    name: encoding-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UTF-8 (no BOM) and LF line endings
        run: python3 scripts/check_encoding.py
      - name: Compile-check all Python sources
        run: |
          python3 -m compileall -q Master/Gateway Master/OTA \
            Master/ROS/ros2_ws/src/iir_interaction \
            Master/ROS/ros2_ws/src/iir_vision_rknn deploy scripts tests

  # 2) STM32 cross-compilation and size report.
  # 2）STM32 交叉编译与体积报告。
  firmware-build:
    name: firmware-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC, CMake and Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi cmake ninja-build
      - name: Configure and build stm32-diff-release
        run: |
          cmake --preset stm32-diff-release
          cmake --build --preset stm32-diff-release
      - name: Verify firmware outputs and print size
        run: |
          test -f build/stm32-diff-release/xzcit_iir_diff.elf
          test -f build/stm32-diff-release/xzcit_iir_diff.hex
          test -f build/stm32-diff-release/xzcit_iir_diff.bin
          arm-none-eabi-size build/stm32-diff-release/xzcit_iir_diff.elf

  # 3) Host-side CTest suite for pure-C firmware modules.
  # 3）纯 C 固件模块宿主机 CTest 测试。
  firmware-host-test:
    name: firmware-host-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build gcc
      - name: Configure, build and run host tests
        run: |
          cmake --preset host-test
          cmake --build --preset host-test
          ctest --preset host-test --output-on-failure

  # 4) ROS 2 full workspace build, test and baseline comparison.
  # 4）ROS 2 全工作空间构建、测试与基线比对。
  ros2-build-and-test:
    name: ros2-build-and-test
    runs-on: ubuntu-24.04
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3-colcon-common-extensions python3-pytest python3-numpy \
            python3-opencv python3-yaml python3-aiohttp \
            ros-humble-rosidl-default-generators ros-humble-nav2-costmap-2d \
            ros-humble-sensor-msgs-py ros-humble-tf2-ros
      - name: Build, test and compare against baseline
        shell: bash
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          colcon build --symlink-install \
            --base-paths "$GITHUB_WORKSPACE/Master/ROS/ros2_ws/src" \
            --build-base "$GITHUB_WORKSPACE/Master/ROS/ros2_ws/build" \
            --install-base "$GITHUB_WORKSPACE/Master/ROS/ros2_ws/install"
          set +u
          source "$GITHUB_WORKSPACE/Master/ROS/ros2_ws/install/setup.bash"
          set -u
          colcon test --packages-select \
            c50c_odom c50c_uart3 opi_robot iir_navigation iir_navigation_vision \
            iir_interfaces iir_vision_rknn iir_interaction \
            --event-handlers console_cohesion+ || true
          colcon test-result --verbose || true
          python3 .github/scripts/compare_ros2_tests.py

  # 5) Gateway and deployment unit/integration tests.
  # 5）Gateway 与部署单元/集成测试。
  gateway-and-deploy-test:
    name: gateway-and-deploy-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gateway, OTA and deployment test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Master/Gateway/requirements.txt \
            -r Master/OTA/requirements.txt pytest httpx
      - name: Run Gateway, OTA and deployment tests
        run: |
          python -m pytest Master/Gateway/tests Master/OTA/tests \
            deploy/test/test_deployment.py deploy/test/test_integration_contract.py \
            deploy/test/test_ota_deployment.py -q

  # 6) Web-Next Rust backend and browser-side JS tests.
  # 6）Web-Next Rust 后端与浏览器侧 JS 测试。
  web-next-test:
    name: web-next-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Master/Web-Next
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -W dead_code -W unused_imports -W unused_variables
      - name: Rust tests
        run: cargo test -- --test-threads=1
      - name: Interaction browser tests
        run: node --test web/test/interaction.test.cjs
      - name: OTA browser tests
        run: node --test web/test/ota.test.cjs
      - name: Syntax-check all web scripts
        run: |
          for file in web/js/*.js; do
            node --check "$file"
          done
